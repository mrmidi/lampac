---
# Lampac — secure VPS default:
# - Lampac listens only on the internal Docker network
# - Caddy is the public edge (80/443) with automatic HTTPS
#
# Env contract:
# - DOMAIN: required for HTTPS mode (example: lampac.example.com)
# - ACME_EMAIL: recommended for Let's Encrypt account/contact
# - HTTP_ONLY=1: optional bootstrap mode (HTTP only on :80, no TLS)
#
name: lampac

services:
  lampac:
    image: ghcr.io/lampac-nextgen/lampac
    restart: unless-stopped
    shm_size: 1024mb
    logging:
      options:
        tag: "{{.Name}}"
    expose:
      - "9118"
    volumes:
      - ./lampac-docker/config/passwd:/lampac/passwd:ro
      - ./lampac-docker/config/init.conf:/lampac/init.conf:ro
      - ./lampac-docker/plugins/lampainit.js:/lampac/plugins/override/lampainit.js
      - ./lampac-docker/cache:/lampac/cache
      - ./lampac-docker/database:/lampac/database
      # Optional: mount user modules (README → Docker → manifest.json / mods)
      # - ./lampac-docker/mods/BulbaCrawler:/lampac/mods/BulbaCrawler
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - lampac
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      HTTP_ONLY: ${HTTP_ONLY:-0}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "${HTTP_ONLY}" = "1" ]; then
          echo "Starting Caddy in HTTP-only bootstrap mode";
          exec caddy run --config /etc/caddy/Caddyfile.http --adapter caddyfile;
        fi;

        if [ -z "${DOMAIN}" ]; then
          echo "ERROR: DOMAIN is required unless HTTP_ONLY=1";
          exit 1;
        fi;

        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.http:/etc/caddy/Caddyfile.http:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

  lampac-debug-port:
    image: alpine/socat
    profiles: ["debug"]
    restart: unless-stopped
    depends_on:
      - lampac
    command: TCP-LISTEN:9118,fork,reuseaddr,bind=0.0.0.0 TCP:lampac:9118
    ports:
      - "127.0.0.1:9118:9118"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
